name: Update WorldWire Feed

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: {} # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install translatepy feedparser deep-translator

      - name: Run pipeline and translation
        run: |
          bash scripts/pipeline.sh
          python3 scripts/translate_fi.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stories.json data/stories_fi.json data/rss_matches.jsonl
          git commit -m "Auto-update news feed data [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build / Stage site files
        run: |
          mkdir -p _site
          cp index.html login.html .nojekyll timestamp.txt _site/ 2>/dev/null || true
          cp -r data _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
