name: Build and Deploy to gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install translatepy feedparser deep-translator

      - name: Run pipeline and translation
        run: |
          bash scripts/pipeline.sh
          python3 scripts/translate_fi.py

      - name: Build site folder
        run: |
          mkdir -p _site
          cp index.html login.html .nojekyll timestamp.txt _site/ 2>/dev/null || true
          cp -r data _site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "Auto-deploy static site [skip ci]"
