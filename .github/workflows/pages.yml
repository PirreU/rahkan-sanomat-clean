name: Deploy GitHub Pages

on:
  schedule:
    - cron: '5 * * * *' # Run 5 minutes past every hour (after update.yml)
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Update WorldWire Feed"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build / Stage site files
        run: |
          mkdir -p _site
          cp index.html login.html .nojekyll timestamp.txt _site/ 2>/dev/null || true
          cp -r data _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
