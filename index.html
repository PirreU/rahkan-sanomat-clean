<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahkan Sanomat</title>
<style>
:root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; line-height:1.6; }
.wrap { max-width:860px; margin:0 auto; padding:32px 20px; }
header { border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:24px; text-align:center; }
h1 { font-size:32px; letter-spacing:1px; }
h1 span { color:var(--accent); }
.story { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:16px; }
.story h2 { font-size:16px; margin-bottom:6px; }
.story h2 a { color:var(--text); text-decoration:none; }
.story h2 a:hover { color:var(--accent); text-decoration:underline; }
.meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
.visitor-box { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; margin-top:32px; margin-bottom:16px; display:none; }
.visitor-box h3 { font-size:14px; margin-bottom:8px; color:var(--accent); }
.visitor-list { font-size:12px; color:var(--dim); list-style-type:none; }
.visitor-list li { padding:4px 0; border-bottom:1px dashed var(--border); }
footer { border-top:1px solid var(--border); margin-top:32px; padding-top:14px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<script>
if (!localStorage.getItem('rs_auth')) {
  window.location.href = './login.html';
}
</script>
<div class="wrap">
<header>
  <h1>Rahkan <span>Sanomat</span></h1>
  <div style="margin-top:14px; display:flex; justify-content:space-between; align-items:center;">
    <div>
      <button id="btn-en" onclick="setLang('en')" style="background:var(--panel);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:bold;margin-right:8px;">English</button>
      <button id="btn-fi" onclick="setLang('fi')" style="background:var(--accent);color:#000;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:bold;">Suomi</button>
    </div>
    <button onclick="logout()" style="background:var(--panel);color:#f85149;border:1px solid var(--border);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;">Sign Out</button>
  </div>
</header>

<div id="stories"><p class="sub">Ladataan uutisia…</p></div>

<div class="visitor-box">
  <h3>Visitor Sign-in Log (Admin Only)</h3>
  <ul id="visitor-list" class="visitor-list"><li>No visits recorded yet.</li></ul>
</div>

<footer>
  Rahkan Sanomat · Multi-perspective European news
</footer>
</div>

<script>
let STORIES_EN = [];
let STORIES_FI = [];

function logout() {
  localStorage.removeItem('rs_auth');
  localStorage.removeItem('rs_admin');
  window.location.href = './login.html';
}

let currentLang = 'fi'; // Default to Finnish
function setLang(l) {
  currentLang = l;
  document.getElementById('btn-en').style.background = l === 'en' ? 'var(--accent)' : 'var(--panel)';
  document.getElementById('btn-en').style.color = l === 'en' ? '#000' : 'var(--text)';
  document.getElementById('btn-fi').style.background = l === 'fi' ? 'var(--accent)' : 'var(--panel)';
  document.getElementById('btn-fi').style.color = l === 'fi' ? '#000' : 'var(--text)';
  render();
}

function render() {
  let stories = currentLang === 'fi' ? STORIES_FI : STORIES_EN;
  const box = document.getElementById('stories');
  if (!stories.length) { box.innerHTML = '<p class="sub">Ei uutisia saatavilla.</p>'; return; }
  box.innerHTML = stories.map(s => {
    const headline = currentLang === 'fi' && s.headline_fi ? s.headline_fi : s.headline;
    const link = s.link || '#';
    const source = s.source || 'Source';
    return `<div class="story"><h2><a href="${link}" target="_blank" rel="noopener">${headline}</a></h2><div class="meta">${source} · Julkaistu: ${s.pub || 'Tuntematon'}</div></div>`;
  }).join('');

  const vBox = document.querySelector('.visitor-box');
  if (localStorage.getItem('rs_admin')) {
    vBox.style.display = 'block';
    const visitors = JSON.parse(localStorage.getItem('rs_visitors') || '[]');
    const vList = document.getElementById('visitor-list');
    vList.innerHTML = visitors.length > 0 ? visitors.map(v => `<li>🗓️ ${v.time} &nbsp;|&nbsp; 🖥️ ${v.ua}</li>`).join('') : '<li>No visits recorded yet.</li>';
  }
}

async function loadStories() {
  try {
    const [resEn, resFi] = await Promise.all([
      fetch('./data/stories.json?t=' + Date.now()),
      fetch('./data/stories_fi.json?t=' + Date.now())
    ]);
    if (resEn.ok) STORIES_EN = await resEn.json();
    if (resFi.ok) STORIES_FI = await resFi.json();
  } catch (e) {
    console.error("Failed to fetch stories data:", e);
  }
  render();
}

loadStories();
</script>
</body>
</html>
